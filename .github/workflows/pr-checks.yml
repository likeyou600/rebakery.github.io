name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check posts
        run: npm test

      - name: Build Hexo site
        run: |
          npx hexo clean
          npx hexo generate
        env:
          TZ: Asia/Taipei
