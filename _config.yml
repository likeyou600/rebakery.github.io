# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 這裡可以改成你的 Blog 名稱
subtitle: 這裡可以改成你的副標題
description: 這裡可以改成你的網站描述，例如：紀錄生活、筆記、工作問題以及學習心得。
keywords: Blog, Notes, Life, Software, Development
author: Bakery Chen
language:
  - zh-tw
  - en
timezone: Asia/Taipei

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://your-username.github.io
permalink: :year:month:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: true
marked:
  prependRoot: true
  postAsset: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ""

# Home page setting
index_generator:
  path: ""
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# Pagination
per_page: 0
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: icarus

# Deployment
# This project deploys through GitHub Actions instead of hexo-deployer-git.
# deploy:
#   type: git
#   repo: https://github.com/your-username/your-username.github.io
#   branch: gh-pages-2

# Sitemap for SEO
# Requires hexo-generator-sitemap if you want to generate sitemap.xml.
sitemap:
  path: sitemap.xml

# External link SEO
# Requires hexo-filter-nofollow if you want to add nofollow to external links.
nofollow:
  enable: true
  field: site
  # exclude:
  #   - your-domain.com
