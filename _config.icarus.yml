# Version of the configuration file
version: 5.1.0

# Icarus theme variant, can be "default" or "cyberpunk"
variant: default

# Path or URL to the website's logo
logo:
  text: Bakery's Blog

# Page metadata configurations
head:
  favicon: /img/favicon.ico
  manifest:
    name: Bakery's Blog
    short_name: Blog
    start_url:
    theme_color:
    background_color:
    display: standalone
    icons:
      - src: /img/favicon.ico
        sizes: 16x16 32x32 48x48 64x64 128x128 256x256
        type: image/x-icon
  open_graph:
    title:
    type: blog
    url:
    image: /img/avatar-transparent.png
    site_name: Bakery's Blog
    author:
    description:
    twitter_card:
    twitter_id:
    twitter_site:
    google_plus:
    fb_admins:
    fb_app_id:
  structured_data:
    title:
    description:
    url:
    author:
    publisher:
    publisher_logo: /img/avatar-transparent.png
    image: /img/avatar-transparent.png
  meta:
    - ""
  rss: /atom.xml

# Page top navigation bar configurations
navbar:
  menu:
    主頁: /
    時光機: /archives
    主題整理: /collections
    # Categories: /categories
    # Tags: /tags
    關於我: /about

# Page footer configurations
footer:
  copyright: 灑下香錦葵，喚醒梅林遺留的試煉
  links:
    Creative Commons:
      icon: fab fa-creative-commons
      url: https://creativecommons.org/
    Attribution 4.0 International:
      icon: fab fa-creative-commons-by
      url: https://creativecommons.org/licenses/by/4.0/

# Article related configurations
article:
  highlight:
    theme:
    clipboard: false
    fold: unfolded
  readtime: false
  update_time: true
  licenses:
    Creative Commons:
      icon: fab fa-creative-commons
      url: https://creativecommons.org/
    Attribution:
      icon: fab fa-creative-commons-by
      url: https://creativecommons.org/licenses/by/4.0/
    Noncommercial:
      icon: fab fa-creative-commons-nc
      url: https://creativecommons.org/licenses/by-nc/4.0/

# Search plugin configurations
search:
  type: insight
  index_pages: true

# Enable table of contents widget on posts and pages.
toc: true

# Comment plugin configurations
# Giscus uses GitHub Discussions as the comment backend.
# Enable Discussions and install the Giscus app, then replace repoId/categoryId below.
comment:
  type: giscus
  repo: likeyou600/rebakery.github.io
  repoId: R_kgDOSmQ7-w
  category: Announcements
  categoryId: DIC_kwDOSmQ7-84C9vs8
  mapping: og:title
  strict: false
  reactionsEnabled: true
  emitMetadata: false
  inputPosition: bottom
  theme: dark
  lang: zh-TW
  lazy: true

# Donate plugin configurations
# Add your own donation settings only if you want to show donation buttons.
donates: []

# Sidebar configurations
sidebar:
  left:
    sticky: true
  right:
    sticky: true

# Sidebar widget configurations
widgets:
  - position: left
    type: profile
    author: Bakery Chen
    author_title: |-
      找工作中的 Engineer
      大概不會有啥技術分享，就簡單紀錄一下
    location: Taiwan
    avatar: /img/avatar-transparent.png
    avatar_rounded: true
    gravatar:
    follow_link:
    social_links:
      Github:
        icon: fab fa-github
        url: https://github.com/likeyou600/rebakery.github.io
      Linkedin:
        icon: fab fa-linkedin
        url: https://www.linkedin.com/in/bakery3uu3/
      Email:
        icon: fas fa-envelope
        url: mailto:bakery3uu3@gmail.com
      RSS:
        icon: fas fa-rss
        url: /atom.xml
  - position: right
    type: toc
    index: false
    collapsed: false
    depth: 4
  # - position: left
  #   type: links
  #   links:
  #     這裡可以放你的作品集: https://example.com
  #     這裡可以放你的 GitHub: https://github.com/your-username
  # - position: left
  #   type: archives
  - position: right
    type: tags
    order_by: name
    amount:
    show_count: true
  - position: right
    type: categories
  - position: right
    type: recent_posts

# Plugin configurations
plugins:
  animejs: false
  back_to_top: true
  baidu_analytics:
    tracking_id:
  bing_webmaster:
    tracking_id:
  busuanzi: false
  cnzz:
    id:
    web_id:
  gallery: true
  google_analytics:
    tracking_id:
  hotjar:
    site_id:
  katex: false
  mathjax: false
  outdated_browser: false
  pjax: false
  progressbar: true
  statcounter:
    project:
    security:
  twitter_conversion_tracking:
    pixel_id:

# CDN provider settings
providers:
  cdn: jsdelivr
  fontcdn: google
  iconcdn: fontawesome
